type: component
id: Audio
name: Audio
description: A base component for audio playback using expo-av.
tags:
  - base
  - media
  - audio
  - player
props:
  source:
    type: string
    description: The source URI of the audio file
    required: true
  autoPlay:
    type: boolean
    description: Whether the audio should auto-play
    default: false
example: |-
  import React from 'react';
  import { FoundationProvider, Audio, Card, Stack, Text } from '@flipova/foundation';

  export default function AudioExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">Audio Example</Text>
            <Audio
            source="Sample"
            autoPlay={false}
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
