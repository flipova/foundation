type: component
id: FlatList
label: List
description: Scrollable list with virtualization.
category: display
example: |-
  import React from 'react';
  import { FoundationProvider, FlatList, Card, Stack, Text } from '@flipova/foundation';

  export default function FlatListExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">List Example</Text>
            <FlatList
            horizontal={false}
            numColumns={1}
            spacing={0}
            showsScrollIndicator={true}
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
tags:
  - list
  - flatlist
  - scroll
  - virtualized
themeMapping:
  bg: background
variants: []
sizes: []
sizeMap: {}
colorMap: {}
props:
  - name: horizontal
    label: Horizontal
    type: boolean
    group: layout
    default: false
  - name: numColumns
    label: Columns
    type: number
    group: layout
    default: 1
  - name: spacing
    label: Item spacing
    type: spacing
    group: layout
    default: 0
  - name: showsScrollIndicator
    label: Scroll indicator
    type: boolean
    group: behavior
    default: true
  - name: background
    label: Background
    type: color
    group: style
