type: primitive
id: Divider
label: Divider
description: Horizontal or vertical divider line.
category: primitive
tags:
  - divider
  - separator
  - line
  - hr
slots: []
props:
  - name: vertical
    label: Vertical
    type: boolean
    group: layout
    default: false
  - name: color
    label: Color
    type: color
    group: style
  - name: thickness
    label: Thickness
    type: number
    group: style
    default: 1
  - name: spacing
    label: Spacing
    type: spacing
    group: layout
example: |-
  import React from 'react';
  import { FoundationProvider, Divider, Card, Stack, Text } from '@flipova/foundation';

  export default function DividerExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">Divider Example</Text>
            <Divider
            vertical={false}
            thickness={1}
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
