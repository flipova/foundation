type: component
id: WheelPicker
name: WheelPicker
description: A scrollable barrel wheel picker. If items exceed maxItemsInWheel, a "More..." option opens a submenu modal.
props:
  - name: items
    type: array
    description: Array of items to pick from { label, value }
    required: true
  - name: value
    type: string
    description: Currently selected value
  - name: itemHeight
    type: number
    description: Height of a single item in pixels
    default: 40
  - name: maxItemsInWheel
    type: number
    description: Maximum number of items to show in the wheel before moving the rest to a submenu
    default: 5
  - name: moreLabel
    type: string
    description: Label for the "More..." option
    default: Plus...
example: |-
  import React from 'react';
  import { FoundationProvider, WheelPicker, Card, Stack, Text } from '@flipova/foundation';

  export default function WheelPickerExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">WheelPicker Example</Text>
            <WheelPicker
            value="Sample"
            itemHeight={40}
            maxItemsInWheel={5}
            moreLabel="Plus..."
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
