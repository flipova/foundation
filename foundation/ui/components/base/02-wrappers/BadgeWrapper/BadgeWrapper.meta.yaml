type: component
id: BadgeWrapper
name: BadgeWrapper
description: Wraps an element and places a customizable notification badge in the top right corner.
props:
  - name: count
    type: number
    description: Number to display in badge. If 0, no badge is shown unless showZero is true.
    default: 0
  - name: showZero
    type: boolean
    description: Show badge even if count is 0
    default: false
  - name: color
    type: string
    description: Badge background color
    default: null
example: |-
  import React from 'react';
  import { FoundationProvider, BadgeWrapper, Card, Stack, Text } from '@flipova/foundation';

  export default function BadgeWrapperExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">BadgeWrapper Example</Text>
            <BadgeWrapper
            count={0}
            showZero={false}
            color="Sample"
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
