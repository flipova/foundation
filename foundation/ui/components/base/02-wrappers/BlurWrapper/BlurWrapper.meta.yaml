type: component
id: BlurWrapper
name: BlurWrapper
description: Wraps children in a frosted glass/blur container.
props:
  - name: intensity
    type: number
    description: Blur intensity (1-100)
    default: 50
  - name: tint
    type: string
    description: Tint color (light, dark, default)
    default: default
example: |-
  import React from 'react';
  import { FoundationProvider, BlurWrapper, Card, Stack, Text } from '@flipova/foundation';

  export default function BlurWrapperExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">BlurWrapper Example</Text>
            <BlurWrapper
            intensity={50}
            tint="default"
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
