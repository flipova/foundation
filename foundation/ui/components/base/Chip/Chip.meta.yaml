type: component
id: Chip
label: Chip
description: Selectable chip / tag with optional close action.
category: input
tags:
  - chip
  - tag
  - filter
  - selectable
themeMapping:
  bg: muted
  text: foreground
  active: primary
variants:
  - name: filled
    label: Filled
    overrides: {}
  - name: outline
    label: Outline
    overrides:
      bg: transparent
      borderWidth: 1
sizes:
  - sm
  - md
sizeMap: {}
colorMap: {}
props:
  - name: label
    label: Label
    type: string
    group: content
  - name: variant
    label: Variant
    type: enum
    group: style
    default: filled
    options:
      - filled
      - outline
  - name: size
    label: Size
    type: enum
    group: style
    default: md
    options:
      - sm
      - md
  - name: selected
    label: Selected
    type: boolean
    group: behavior
    default: false
  - name: closable
    label: Closable
    type: boolean
    group: behavior
    default: false
  - name: disabled
    label: Disabled
    type: boolean
    group: behavior
    default: false
  - name: borderRadius
    label: Border radius
    type: radius
    group: style
    default: full
example: |-
  import React, { useState } from 'react';
  import { FoundationProvider, Chip, Card, Stack, Text, Button } from '@flipova/foundation';

  export default function ChipExample() {
    const [value, setValue] = useState('');

    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated" style={{ maxWidth: 400 }}>
          <Stack spacing={4}>
            <Text variant="heading" size="md">Chip Input</Text>
            <Chip
            label="Label"
            variant="filled"
            size="md"
            selected={false}
            closable={false}
            disabled={false}
          value={value} onChangeText={setValue} />
            <Button variant="primary" label="Submit" onPress={() => console.log(value)} />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
