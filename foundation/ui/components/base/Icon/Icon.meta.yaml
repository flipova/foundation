type: component
id: Icon
label: Icon
description: Vector icon from Feather icon set.
category: display
tags:
  - icon
  - feather
  - vector
  - symbol
themeMapping:
  color: foreground
variants: []
sizes:
  - sm
  - md
  - lg
sizeMap: {}
colorMap: {}
props:
  - name: name
    label: Icon name
    type: string
    group: content
    default: star
  - name: size
    label: Size
    type: number
    group: style
    default: 24
  - name: color
    label: Color
    type: color
    group: style
    themeDefault: foreground
  - name: strokeWidth
    label: Stroke width
    type: number
    group: style
    default: 2
example: |-
  import React from 'react';
  import { FoundationProvider, Icon, Card, Stack, Text } from '@flipova/foundation';

  export default function IconExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">Icon Example</Text>
            <Icon
            name="star"
            size={24}
            strokeWidth={2}
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
