type: component
id: Separator
label: Separator
description: Visual separator with optional label.
category: display
tags:
  - separator
  - divider
  - or
  - line
themeMapping:
  color: border
  text: mutedForeground
variants: []
sizes: []
sizeMap: {}
colorMap: {}
props:
  - name: label
    label: Label
    type: string
    group: content
  - name: color
    label: Color
    type: color
    group: style
    themeDefault: border
  - name: thickness
    label: Thickness
    type: number
    group: style
    default: 1
  - name: spacing
    label: Spacing
    type: spacing
    group: layout
    default: 4
  - name: orientation
    label: Orientation
    type: enum
    group: layout
    default: horizontal
    options:
      - horizontal
      - vertical
example: |-
  import React from 'react';
  import { FoundationProvider, Separator, Card, Stack, Text } from '@flipova/foundation';

  export default function SeparatorExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">Separator Example</Text>
            <Separator
            label="Label"
            thickness={1}
            spacing={4}
            orientation="horizontal"
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
