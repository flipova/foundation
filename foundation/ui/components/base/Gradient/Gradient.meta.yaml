type: component
id: Gradient
label: Gradient
description: Linear gradient background container.
category: display
tags:
  - gradient
  - linear
  - background
  - color
themeMapping: {}
variants: []
sizes: []
sizeMap: {}
colorMap: {}
props:
  - name: startColor
    label: Start color
    type: color
    group: style
    default: '#3b82f6'
  - name: endColor
    label: End color
    type: color
    group: style
    default: '#8b5cf6'
  - name: direction
    label: Direction
    type: enum
    group: style
    default: vertical
    options:
      - vertical
      - horizontal
      - diagonal
  - name: borderRadius
    label: Border radius
    type: radius
    group: style
    default: none
  - name: height
    label: Height
    type: number
    group: layout
  - name: padding
    label: Padding
    type: spacing
    group: layout
example: |-
  import React from 'react';
  import { FoundationProvider, Gradient, Card, Stack, Text } from '@flipova/foundation';

  export default function GradientExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">Gradient Example</Text>
            <Gradient
            startColor="#3b82f6"
            endColor="#8b5cf6"
            direction="vertical"
            borderRadius="none"
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
