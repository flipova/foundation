type: component
id: TextArea
label: Text Area
description: Multi-line text input.
category: input
tags:
  - textarea
  - multiline
  - input
  - form
themeMapping:
  bg: input
  text: foreground
  border: border
variants:
  - name: outlined
    label: Outlined
    overrides:
      borderWidth: 1
      bg: transparent
  - name: filled
    label: Filled
    overrides:
      borderWidth: 0
sizes:
  - sm
  - md
  - lg
sizeMap:
  sm:
    height: 80
    px: 3
    py: 2
    fontSize: 13
    labelSize: 11
  md:
    height: 120
    px: 4
    py: 3
    fontSize: 15
    labelSize: 13
  lg:
    height: 180
    px: 5
    py: 4
    fontSize: 17
    labelSize: 14
colorMap: {}
props:
  - name: variant
    label: Variant
    type: enum
    group: style
    default: outlined
    options:
      - outlined
      - filled
  - name: size
    label: Size
    type: enum
    group: style
    default: md
    options:
      - sm
      - md
      - lg
  - name: placeholder
    label: Placeholder
    type: string
    group: content
  - name: label
    label: Label
    type: string
    group: content
  - name: error
    label: Error message
    type: string
    group: content
  - name: disabled
    label: Disabled
    type: boolean
    group: behavior
    default: false
  - name: numberOfLines
    label: Lines
    type: number
    group: layout
    default: 4
  - name: borderRadius
    label: Border radius
    type: radius
    group: style
    default: md
  - name: background
    label: Background
    type: color
    group: style
    themeDefault: input
