type: component
id: WebView
label: WebView
description: Embedded web browser view.
category: media
tags:
  - webview
  - browser
  - iframe
  - embed
themeMapping:
  bg: muted
variants: []
sizes: []
sizeMap: {}
colorMap: {}
props:
  - name: url
    label: URL
    type: string
    group: content
    default: https://expo.dev
  - name: width
    label: Width
    type: number
    group: layout
  - name: height
    label: Height
    type: number
    group: layout
    default: 400
  - name: scrollEnabled
    label: Scroll
    type: boolean
    group: behavior
    default: true
  - name: borderRadius
    label: Border radius
    type: radius
    group: style
    default: none
example: |-
  import React from 'react';
  import { FoundationProvider, WebView, Card, Stack, Text } from '@flipova/foundation';

  export default function WebViewExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">WebView Example</Text>
            <WebView
            url="https://expo.dev"
            height={400}
            scrollEnabled={true}
            borderRadius="none"
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
