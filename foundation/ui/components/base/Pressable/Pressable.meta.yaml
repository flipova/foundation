type: component
id: Pressable
label: Pressable
description: Generic pressable wrapper with feedback.
category: action
tags:
  - pressable
  - touchable
  - tap
  - click
themeMapping: {}
variants: []
sizes: []
sizeMap: {}
colorMap: {}
props:
  - name: disabled
    label: Disabled
    type: boolean
    group: behavior
    default: false
  - name: opacity
    label: Press opacity
    type: number
    group: style
    default: 0.7
example: |-
  import React from 'react';
  import { FoundationProvider, Pressable, Inline, Stack, Text } from '@flipova/foundation';

  export default function PressableExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Stack spacing={4} style={{ padding: 20 }}>
          <Text variant="heading" size="md">Pressable Actions</Text>
          <Inline spacing={3} alignItems="center">
            <Pressable
            disabled={false}
            opacity={0.7}
          onPress={() => console.log('Pressable pressed')} />
          </Inline>
        </Stack>
      </FoundationProvider>
    );
  }
