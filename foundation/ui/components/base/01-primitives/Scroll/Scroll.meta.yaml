type: primitive
id: Scroll
label: Scroll
description: Scrollable container.
category: primitive
tags:
  - scroll
  - scrollview
  - overflow
slots:
  - name: children
    label: Content
    required: false
props:
  - name: horizontal
    label: Horizontal
    type: boolean
    group: layout
    default: false
  - name: showsScrollIndicator
    label: Show Indicator
    type: boolean
    group: behavior
    default: true
  - name: scrollEnabled
    label: Scroll Enabled
    type: boolean
    group: behavior
    default: true
  - name: bg
    label: Background
    type: color
    group: style
  - name: p
    label: Padding
    type: spacing
    group: layout
  - name: flex
    label: Flex
    type: number
    group: layout
example: |-
  import React from 'react';
  import { FoundationProvider, Scroll, Card, Stack, Text } from '@flipova/foundation';

  export default function ScrollExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">Scroll Example</Text>
            <Scroll
            horizontal={false}
            showsScrollIndicator={true}
            scrollEnabled={true}
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
