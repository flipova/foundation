type: primitive
id: Inline
label: Inline
description: Horizontal row with spacing and alignment.
category: primitive
tags:
  - inline
  - horizontal
  - row
  - hstack
slots:
  - name: children
    label: Content
    required: false
props:
  - name: spacing
    label: Spacing
    type: spacing
    group: layout
    default: 2
  - name: align
    label: Align
    type: enum
    group: layout
    options:
      - stretch
      - flex-start
      - center
      - flex-end
      - baseline
  - name: justify
    label: Justify
    type: enum
    group: layout
    options:
      - flex-start
      - center
      - flex-end
      - space-between
      - space-around
  - name: wrap
    label: Wrap
    type: boolean
    group: layout
    default: false
  - name: bg
    label: Background
    type: color
    group: style
  - name: p
    label: Padding
    type: spacing
    group: layout
  - name: flex
    label: Flex
    type: number
    group: layout
  - name: fillWidth
    label: Fill Width
    type: boolean
    group: layout
    default: false
example: |-
  import React from 'react';
  import { FoundationProvider, Inline, Card, Stack, Text } from '@flipova/foundation';

  export default function InlineExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">Inline Example</Text>
            <Inline
            spacing={2}
            align="stretch"
            justify="flex-start"
            wrap={false}
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
