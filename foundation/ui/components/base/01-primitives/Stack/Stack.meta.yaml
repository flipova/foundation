type: primitive
id: Stack
label: Stack
description: Vertical stack with consistent spacing between children.
category: primitive
tags:
  - stack
  - vertical
  - column
  - vstack
slots:
  - name: children
    label: Content
    required: false
props:
  - name: spacing
    label: Spacing
    type: spacing
    group: layout
    default: 2
  - name: align
    label: Align
    type: enum
    group: layout
    options:
      - stretch
      - flex-start
      - center
      - flex-end
  - name: bg
    label: Background
    type: color
    group: style
  - name: p
    label: Padding
    type: spacing
    group: layout
  - name: flex
    label: Flex
    type: number
    group: layout
example: |-
  import React from 'react';
  import { FoundationProvider, Stack, Card, Stack, Text } from '@flipova/foundation';

  export default function StackExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">Stack Example</Text>
            <Stack
            spacing={2}
            align="stretch"
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
