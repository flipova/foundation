type: component
id: Badge
label: Badge
description: Small status indicator or label.
category: display
tags:
  - badge
  - tag
  - label
  - status
themeMapping:
  bg: primary
  text: primaryForeground
variants:
  - name: solid
    label: Solid
    overrides: {}
  - name: outline
    label: Outline
    overrides:
      bg: transparent
      borderWidth: 1
  - name: subtle
    label: Subtle
    overrides: {}
sizes:
  - sm
  - md
sizeMap: {}
colorMap:
  primary:
    solid:
      - primary
      - primaryForeground
    subtle:
      - primary
      - primaryForeground
  secondary:
    solid:
      - secondary
      - secondaryForeground
    subtle:
      - secondary
      - secondaryForeground
  success:
    solid:
      - success
      - '#fff'
    subtle:
      - '#dcfce7'
      - '#166534'
  warning:
    solid:
      - warning
      - '#fff'
    subtle:
      - '#fef3c7'
      - '#92400e'
  error:
    solid:
      - error
      - '#fff'
    subtle:
      - '#fee2e2'
      - '#991b1b'
  info:
    solid:
      - info
      - '#fff'
    subtle:
      - '#e0f2fe'
      - '#0369a1'
props:
  - name: label
    label: Label
    type: string
    group: content
  - name: variant
    label: Variant
    type: enum
    group: style
    default: solid
    options:
      - solid
      - outline
      - subtle
  - name: size
    label: Size
    type: enum
    group: style
    default: md
    options:
      - sm
      - md
  - name: color
    label: Color scheme
    type: enum
    group: style
    default: primary
    options:
      - primary
      - secondary
      - success
      - warning
      - error
      - info
  - name: borderRadius
    label: Border radius
    type: radius
    group: style
    default: full
