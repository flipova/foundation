type: component
id: MapView
label: Map
description: Interactive map view with markers.
category: media
tags:
  - map
  - location
  - gps
  - marker
themeMapping: {}
variants: []
sizes: []
sizeMap: {}
colorMap: {}
props:
  - name: latitude
    label: Latitude
    type: number
    group: content
    default: 48.8566
  - name: longitude
    label: Longitude
    type: number
    group: content
    default: 2.3522
  - name: zoom
    label: Zoom
    type: number
    group: content
    default: 12
  - name: width
    label: Width
    type: number
    group: layout
  - name: height
    label: Height
    type: number
    group: layout
    default: 300
  - name: borderRadius
    label: Border radius
    type: radius
    group: style
    default: lg
  - name: showsUserLocation
    label: User location
    type: boolean
    group: behavior
    default: true
example: |-
  import React from 'react';
  import { FoundationProvider, MapView, Card, Stack, Text } from '@flipova/foundation';

  export default function MapViewExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">Map Example</Text>
            <MapView
            latitude={48.8566}
            longitude={2.3522}
            zoom={12}
            height={300}
            borderRadius="lg"
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
