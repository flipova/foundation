type: component
id: Tabs
label: Tabs
description: Tab navigation with content panels.
category: navigation
tags:
  - tabs
  - navigation
  - panel
  - switch
themeMapping:
  active: primary
  bg: card
  border: border
variants: []
sizes: []
sizeMap: {}
colorMap: {}
props:
  - name: activeColor
    label: Active color
    type: color
    group: style
    themeDefault: primary
  - name: background
    label: Background
    type: color
    group: style
    themeDefault: card
  - name: borderRadius
    label: Border radius
    type: radius
    group: style
    default: none
  - name: position
    label: Position
    type: enum
    group: layout
    default: top
    options:
      - top
      - bottom
example: |-
  import React from 'react';
  import { FoundationProvider, Tabs, Card, Stack, Text } from '@flipova/foundation';

  export default function TabsExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Card p={5} borderRadius="lg" variant="elevated">
          <Stack spacing={3}>
            <Text variant="heading" size="md">Tabs Example</Text>
            <Tabs
            borderRadius="none"
            position="top"
          />
          </Stack>
        </Card>
      </FoundationProvider>
    );
  }
