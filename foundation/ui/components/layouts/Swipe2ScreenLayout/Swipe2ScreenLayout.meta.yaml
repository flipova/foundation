type: layout
id: Swipe2ScreenLayout
label: Swipe to Screen
description: Presentation layout with swipe to a projected screen and QR code.
category: special
tags:
  - swipe
  - projection
  - qr
  - slides
architecture:
  dependencies:
    - react-native-gesture-handler
    - expo-camera
    - expo-haptics
slots:
  - name: items
    label: Slides
    required: true
    kind: items
responsive: false
animated: true
previewItemCount: 3
props:
  - name: containerBackground
    label: Container Background
    type: color
    group: style
    default: '#000'
  - name: screenBackground
    label: Screen Background
    type: color
    group: style
    default: '#fff'
  - name: swipeThreshold
    label: Swipe Threshold
    type: number
    group: behavior
    default: 100
  - name: projectedScale
    label: Projected Scale
    type: ratio
    group: behavior
    default: 0.8
    min: 0.5
    max: 1
  - name: animationDuration
    label: Animation Duration
    type: number
    group: behavior
    default: 300
  - name: slides
    label: Slides
    type: json
    group: content
    default: []
example: |-
  import React from 'react';
  import { FoundationProvider, Swipe2ScreenLayout, Card, Text, Stack } from '@flipova/foundation';

  export default function Swipe2ScreenLayoutExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <Swipe2ScreenLayout
            containerBackground="#000"
            screenBackground="#fff"
            swipeThreshold={100}
            projectedScale={0.8}
            animationDuration={300}
          >
          <Card p={4} variant="elevated">
            <Stack spacing={2}>
              <Text variant="heading" size="md">Swipe to Screen Section 1</Text>
              <Text color="mutedForeground">Content layout block powered by Flipova Foundation.</Text>
            </Stack>
          </Card>
          <Card p={4} variant="outlined">
            <Text variant="heading" size="md">Swipe to Screen Section 2</Text>
          </Card>
        </Swipe2ScreenLayout>
      </FoundationProvider>
    );
  }
