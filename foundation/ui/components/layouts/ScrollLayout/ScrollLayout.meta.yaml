type: layout
id: ScrollLayout
label: Scroll
description: Scrollable structure with sticky or inline header/footer.
category: scroll
tags:
  - scroll
  - sticky
  - header
  - footer
  - safe-area
themeMapping:
  root: background
  surface: card
slots:
  - name: content
    label: Content
    required: true
    kind: named
  - name: header
    label: Header
    required: false
    kind: named
  - name: footer
    label: Footer
    required: false
    kind: named
responsive: true
animated: false
props:
  - name: spacing
    label: Spacing
    type: spacing
    group: layout
    default: 4
  - name: useSafeAreaInsets
    label: Safe area
    type: boolean
    group: behavior
    default: true
  - name: headerHeight
    label: Header Height
    type: number
    group: layout
    default: 80
  - name: footerHeight
    label: Footer Height
    type: number
    group: layout
    default: 60
  - name: scrollDirection
    label: Scroll Direction
    type: enum
    group: behavior
    default: vertical
    options:
      - vertical
      - horizontal
      - both
  - name: showScrollIndicator
    label: Scroll Indicator
    type: boolean
    group: behavior
    default: false
  - name: enableBounces
    label: Bounce
    type: boolean
    group: behavior
    default: true
  - name: stickyHeader
    label: Sticky Header
    type: boolean
    group: behavior
    default: false
  - name: stickyFooter
    label: Sticky Footer
    type: boolean
    group: behavior
    default: false
  - name: background
    label: Background
    type: color
    group: style
    themeDefault: background
  - name: borderRadius
    label: Border Radius
    type: radius
    group: style
    default: none
  - name: headerBackground
    label: Header Background
    type: color
    group: style
    themeDefault: card
  - name: footerBackground
    label: Footer Background
    type: color
    group: style
    themeDefault: card
  - name: contentBackground
    label: Content Background
    type: color
    group: style
  - name: headerPadding
    label: Header Padding
    type: spacing
    group: layout
    default: 4
  - name: footerPadding
    label: Footer Padding
    type: spacing
    group: layout
    default: 4
  - name: mobileHeaderHeight
    label: Mobile Header Height
    type: number
    group: layout
    default: 60
  - name: mobileFooterHeight
    label: Mobile Footer Height
    type: number
    group: layout
    default: 50
example: |-
  import React from 'react';
  import { FoundationProvider, ScrollLayout, Card, Text, Stack } from '@flipova/foundation';

  export default function ScrollLayoutExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <ScrollLayout
            spacing={4}
            useSafeAreaInsets={true}
            headerHeight={80}
            footerHeight={60}
            scrollDirection="vertical"
            showScrollIndicator={false}
          >
          <Card p={4} variant="elevated">
            <Stack spacing={2}>
              <Text variant="heading" size="md">Scroll Section 1</Text>
              <Text color="mutedForeground">Content layout block powered by Flipova Foundation.</Text>
            </Stack>
          </Card>
          <Card p={4} variant="outlined">
            <Text variant="heading" size="md">Scroll Section 2</Text>
          </Card>
        </ScrollLayout>
      </FoundationProvider>
    );
  }
