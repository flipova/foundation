type: layout
id: BottomDrawerLayout
label: Bottom Drawer
description: Animated bottom drawer with swipe gesture.
category: navigation
tags:
  - drawer
  - bottom-sheet
  - swipe
  - modal
architecture:
  dependencies:
    - react-native-reanimated
    - react-native-gesture-handler
    - expo-haptics
themeMapping:
  root: background
  drawer: background
  accent: primary
  border: border
slots:
  - name: content
    label: Main content
    required: true
    kind: named
  - name: drawerContent
    label: Drawer content
    required: true
    kind: named
constants:
  springConfig:
    damping: 25
    stiffness: 200
    mass: 0.5
    overshootClamping: true
responsive: true
animated: true
props:
  - name: drawerHeight
    label: Drawer Height
    type: number
    group: layout
    default: 400
  - name: maxWidth
    label: Max Width
    type: number
    group: layout
  - name: scrollable
    label: Scrollable
    type: boolean
    group: behavior
    default: true
  - name: drawerBackground
    label: Drawer Background
    type: color
    group: style
    themeDefault: background
  - name: drawerBorderRadius
    label: Drawer Radius
    type: radius
    group: style
    default: 3xl
  - name: background
    label: Background
    type: color
    group: style
    themeDefault: background
  - name: borderRadius
    label: Border Radius
    type: radius
    group: style
    default: none
  - name: defaultOpen
    label: Open by Default
    type: boolean
    group: behavior
    default: false
  - name: handleColor
    label: Handle Color
    type: color
    group: style
    themeDefault: primary
  - name: backdropOpacity
    label: Backdrop Opacity
    type: ratio
    group: style
    default: 0.4
    min: 0
    max: 1
  - name: contentScaleWhenOpen
    label: Open Content Scale
    type: ratio
    group: behavior
    default: 0.95
    min: 0.5
    max: 1
  - name: handleBarColor
    label: Handle Bar Color
    type: color
    group: style
    themeDefault: border
  - name: handleButtonSize
    label: Handle Button Size
    type: number
    group: layout
    default: 56
example: |-
  import React from 'react';
  import { FoundationProvider, BottomDrawerLayout, Card, Text, Stack } from '@flipova/foundation';

  export default function BottomDrawerLayoutExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <BottomDrawerLayout
            drawerHeight={400}
            scrollable={true}
            drawerBorderRadius="3xl"
          >
          <Card p={4} variant="elevated">
            <Stack spacing={2}>
              <Text variant="heading" size="md">Bottom Drawer Section 1</Text>
              <Text color="mutedForeground">Content layout block powered by Flipova Foundation.</Text>
            </Stack>
          </Card>
          <Card p={4} variant="outlined">
            <Text variant="heading" size="md">Bottom Drawer Section 2</Text>
          </Card>
        </BottomDrawerLayout>
      </FoundationProvider>
    );
  }
