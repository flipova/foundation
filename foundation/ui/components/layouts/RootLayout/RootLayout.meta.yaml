type: layout
id: RootLayout
label: Root
description: Root page container with direct flex control. Ideal as the base of every page.
category: page
tags:
  - root
  - page
  - container
  - flex
themeMapping:
  root: background
slots:
  - name: children
    label: Content
    required: true
    kind: children
responsive: false
animated: false
props:
  - name: background
    label: Background
    type: color
    group: style
    themeDefault: background
  - name: scrollable
    label: Scrollable
    type: boolean
    group: behavior
    default: true
  - name: padding
    label: Padding
    type: spacing
    group: layout
    default: 0
  - name: justifyContent
    label: Justify
    type: enum
    group: layout
    default: flex-start
    options:
      - flex-start
      - center
      - flex-end
      - space-between
      - space-around
      - space-evenly
  - name: alignItems
    label: Align Items
    type: enum
    group: layout
    default: stretch
    options:
      - stretch
      - flex-start
      - center
      - flex-end
      - baseline
  - name: flexDirection
    label: Direction
    type: enum
    group: layout
    default: column
    options:
      - column
      - row
  - name: gap
    label: Gap
    type: number
    group: layout
    default: 0
example: |-
  import React from 'react';
  import { FoundationProvider, RootLayout, Card, Text, Stack } from '@flipova/foundation';

  export default function RootLayoutExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <RootLayout
            scrollable={true}
            padding={0}
            justifyContent="flex-start"
            alignItems="stretch"
            flexDirection="column"
          >
          <Card p={4} variant="elevated">
            <Stack spacing={2}>
              <Text variant="heading" size="md">Root Section 1</Text>
              <Text color="mutedForeground">Content layout block powered by Flipova Foundation.</Text>
            </Stack>
          </Card>
          <Card p={4} variant="outlined">
            <Text variant="heading" size="md">Root Section 2</Text>
          </Card>
        </RootLayout>
      </FoundationProvider>
    );
  }
