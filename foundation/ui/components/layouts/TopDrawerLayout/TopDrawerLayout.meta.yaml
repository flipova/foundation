type: layout
id: TopDrawerLayout
label: Top Drawer
description: Animated top drawer with swipe gesture.
category: navigation
tags:
  - drawer
  - top-sheet
  - swipe
  - notification
architecture:
  dependencies:
    - react-native-reanimated
    - react-native-gesture-handler
    - expo-haptics
themeMapping:
  root: background
  drawer: background
  border: border
  muted: muted
slots:
  - name: content
    label: Main Content
    required: true
    kind: named
  - name: drawerContent
    label: Drawer Content
    required: true
    kind: named
constants:
  springConfig:
    damping: 25
    stiffness: 200
    mass: 0.5
    overshootClamping: true
responsive: false
animated: true
props:
  - name: drawerHeight
    label: Drawer Height
    type: number
    group: layout
    default: 600
  - name: maxWidth
    label: Max Width
    type: number
    group: layout
  - name: scrollable
    label: Scrollable
    type: boolean
    group: behavior
    default: true
  - name: drawerBackground
    label: Drawer Background
    type: color
    group: style
    themeDefault: background
  - name: drawerBorderRadius
    label: Drawer Radius
    type: radius
    group: style
    default: 3xl
  - name: background
    label: Background
    type: color
    group: style
    themeDefault: background
  - name: borderRadius
    label: Border Radius
    type: radius
    group: style
    default: none
  - name: defaultOpen
    label: Open by Default
    type: boolean
    group: behavior
    default: false
  - name: handleColor
    label: Handle Color
    type: color
    group: style
    themeDefault: border
  - name: backdropOpacity
    label: Backdrop Opacity
    type: ratio
    group: style
    default: 0.4
    min: 0
    max: 1
  - name: contentScaleWhenOpen
    label: Open Content Scale
    type: ratio
    group: behavior
    default: 0.95
    min: 0.5
    max: 1
  - name: closeButtonBackground
    label: Close Button Background
    type: color
    group: style
    themeDefault: muted
  - name: closeButtonSize
    label: Close Button Size
    type: number
    group: layout
    default: 36
  - name: closeButtonBorderColor
    label: Close Button Border
    type: color
    group: style
    themeDefault: border
  - name: closeButtonTextColor
    label: Close Button Text
    type: color
    group: style
    themeDefault: mutedForeground
example: |-
  import React from 'react';
  import { FoundationProvider, TopDrawerLayout, Card, Text, Stack } from '@flipova/foundation';

  export default function TopDrawerLayoutExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <TopDrawerLayout
            drawerHeight={600}
            scrollable={true}
            drawerBorderRadius="3xl"
          >
          <Card p={4} variant="elevated">
            <Stack spacing={2}>
              <Text variant="heading" size="md">Top Drawer Section 1</Text>
              <Text color="mutedForeground">Content layout block powered by Flipova Foundation.</Text>
            </Stack>
          </Card>
          <Card p={4} variant="outlined">
            <Text variant="heading" size="md">Top Drawer Section 2</Text>
          </Card>
        </TopDrawerLayout>
      </FoundationProvider>
    );
  }
