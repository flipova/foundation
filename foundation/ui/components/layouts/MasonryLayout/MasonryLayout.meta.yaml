type: layout
id: MasonryLayout
label: Masonry
description: Multi-column masonry grid.
category: content
tags:
  - masonry
  - pinterest
  - waterfall
themeMapping:
  root: background
  surface: card
slots:
  - name: items
    label: Items
    required: true
    kind: items
responsive: false
animated: false
previewItemCount: 6
props:
  - name: columns
    label: Columns
    type: number
    group: layout
    default: 2
  - name: spacing
    label: Spacing
    type: spacing
    group: layout
    default: 1
  - name: maxWidth
    label: Max Width
    type: number
    group: layout
  - name: scrollable
    label: Scrollable
    type: boolean
    group: behavior
    default: true
  - name: background
    label: Background
    type: color
    group: style
    default: transparent
  - name: borderRadius
    label: Border Radius
    type: radius
    group: style
    default: none
  - name: itemBackground
    label: Item Background
    type: color
    group: style
    themeDefault: card
  - name: itemBorderRadius
    label: Item Radius
    type: radius
    group: style
    default: none
  - name: padding
    label: Padding
    type: padding
    group: layout
example: |-
  import React from 'react';
  import { FoundationProvider, MasonryLayout, Card, Text, Stack } from '@flipova/foundation';

  export default function MasonryLayoutExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <MasonryLayout
            columns={2}
            spacing={1}
            scrollable={true}
            background="transparent"
            borderRadius="none"
          >
          <Card p={4} variant="elevated">
            <Stack spacing={2}>
              <Text variant="heading" size="md">Masonry Section 1</Text>
              <Text color="mutedForeground">Content layout block powered by Flipova Foundation.</Text>
            </Stack>
          </Card>
          <Card p={4} variant="outlined">
            <Text variant="heading" size="md">Masonry Section 2</Text>
          </Card>
        </MasonryLayout>
      </FoundationProvider>
    );
  }
