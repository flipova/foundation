type: layout
id: CenteredLayout
label: Centered
description: Centered content with optional card and maxWidth.
category: page
tags:
  - centered
  - form
  - onboarding
  - modal
themeMapping:
  root: background
  surface: card
slots:
  - name: children
    label: Content
    required: true
    kind: children
responsive: true
animated: false
props:
  - name: maxWidth
    label: Card Max Width
    type: number
    group: layout
    default: 500
  - name: padding
    label: Card Padding
    type: spacing
    group: layout
    default: 4
  - name: background
    label: Page Background
    type: color
    group: style
    themeDefault: background
  - name: cardBackground
    label: Card Background
    type: color
    group: style
    themeDefault: card
  - name: borderRadius
    label: Border Radius
    type: radius
    group: style
    default: 3xl
  - name: shadowed
    label: Card Shadow
    type: boolean
    group: style
    default: false
  - name: mobilePadding
    label: Mobile Padding
    type: spacing
    group: layout
    default: 4
  - name: desktopPadding
    label: Desktop Padding
    type: spacing
    group: layout
    default: 6
example: |-
  import React from 'react';
  import { FoundationProvider, CenteredLayout, Card, Text, Stack } from '@flipova/foundation';

  export default function CenteredLayoutExample() {
    return (
      <FoundationProvider defaultTheme="dark">
        <CenteredLayout
            maxWidth={500}
            padding={4}
            borderRadius="3xl"
            shadowed={false}
          >
          <Card p={4} variant="elevated">
            <Stack spacing={2}>
              <Text variant="heading" size="md">Centered Section 1</Text>
              <Text color="mutedForeground">Content layout block powered by Flipova Foundation.</Text>
            </Stack>
          </Card>
          <Card p={4} variant="outlined">
            <Text variant="heading" size="md">Centered Section 2</Text>
          </Card>
        </CenteredLayout>
      </FoundationProvider>
    );
  }
