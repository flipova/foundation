# corral-ci-lib secrets v1 sha256:e903964e4c78fc03
name: secrets
description: Fails when a credential looks committed. Never prints the value.
inputs:
  exclude:
    description: Regular expression of paths to skip
    default: (^|/)(node_modules|dist|build|coverage|vendor|\.git)/|(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Cargo\.lock|poetry\.lock|go\.sum)$|^documentation/i18n/
runs:
  using: composite
  steps:
    - name: Scan for committed secrets
      shell: bash
      env:
        SECRETS_EXCLUDE: ${{ inputs.exclude }}
      run: |
        set -euo pipefail
        report="$RUNNER_TEMP/detect-secrets.json"
        pipx run --spec detect-secrets==1.5.0 detect-secrets scan --all-files --exclude-files "$SECRETS_EXCLUDE" > "$report"
        python3 - "$report" <<'PY'
        import json, sys
        found = json.load(open(sys.argv[1])).get("results", {})
        n = sum(len(v) for v in found.values())
        for path, items in sorted(found.items()):
            for i in items:
                print(f"::error file={path},line={i.get('line_number', 1)}::possible secret ({i.get('type')}): rotate it if it is real, or add a 'pragma: allowlist secret' comment if it is not")
        print(f"{n} possible secret(s) in {len(found)} file(s)")
        sys.exit(1 if n else 0)
        PY
