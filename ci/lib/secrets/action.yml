# corral-ci-lib secrets v4 sha256:0770bd45f2998c30
name: secrets
description: Fails when a credential looks committed. Never prints the value. Settled by an inline pragma, by the baseline, or by the tolerate input.
inputs:
  exclude:
    description: Extended regular expression of more paths to skip (added to dependencies, build output, lock files and the baseline)
    default: ''
  tolerate:
    description: Extended regular expression of paths where the keyword detector is off (test data); provider keys and entropy are still checked there
    default: ''
  keywords:
    description: "What the keyword detector (a variable named password, token, secret...) does: report (default: fails on configuration files, only reports in source code), all (fails everywhere), config (not looked for in source code), or off. Provider keys, private keys and entropy always fail the scan"
    default: report
  baseline:
    description: Baseline file of secrets accepted as not real, written by corral ci secrets --baseline
    default: .secrets.baseline
  mode:
    description: block (default) fails the job, warn only reports
    default: block
runs:
  using: composite
  steps:
    - name: Scan for committed secrets
      shell: bash
      env:
        EXCLUDE: ${{ inputs.exclude }}
        TOLERATE: ${{ inputs.tolerate }}
        KEYWORDS: ${{ inputs.keywords }}
        BASELINE: ${{ inputs.baseline }}
        MODE: ${{ inputs.mode }}
      run: |
        hook=(pipx run --spec detect-secrets==1.5.0 detect-secrets-hook)
        set -euo pipefail
        default_exclude='(^|/)(node_modules|dist|build|coverage|vendor|\.git)/|^ci/lib/|(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|Cargo\.lock|poetry\.lock|go\.sum|i18n\.lock\.json|skills-lock\.json|assets\.index\.json|\.secrets\.baseline)$|^documentation/i18n/'
        exclude="$default_exclude${EXCLUDE:+|$EXCLUDE}"
        work="$(mktemp -d)"
        git ls-files -z | { grep -zvE "$exclude" || true; } > "$work/all"
        code_files='\.(ts|tsx|js|jsx|mjs|cjs|mts|cts|vue|svelte|py|rb|go|java|kt|kts|scala|swift|rs|php|cs|c|cc|cpp|h|hpp|dart|ex|exs)$'
        case "${KEYWORDS:-report}" in
          off) tol='.' ;;
          config|report) tol="$code_files${TOLERATE:+|$TOLERATE}" ;;
          *) tol="${TOLERATE:-}" ;;
        esac
        if [ -n "$tol" ]; then
          { grep -zE "$tol" "$work/all" || true; } > "$work/tolerated"
          { grep -zvE "$tol" "$work/all" || true; } > "$work/strict"
        else
          cp "$work/all" "$work/strict"; : > "$work/tolerated"
        fi
        : > "$work/advice"
        if [ "${KEYWORDS:-report}" = report ]; then
          { grep -zE "$code_files" "$work/all" || true; } | { if [ -n "${TOLERATE:-}" ]; then grep -zvE "$TOLERATE" || true; else cat; fi; } > "$work/advice"
        fi
        args=()
        if [ -f "$BASELINE" ]; then
          if grep -Eq '"is_secret": *true' "$BASELINE"; then
            echo "ERROR $BASELINE: an entry is audited as a real secret. Rotate it, then delete the entry."
            exit 1
          fi
          cp "$BASELINE" "$work/baseline.json"
          args+=(--baseline "$work/baseline.json")
        fi
        status=0
        scan() {
          local list="$1"; shift
          [ -s "$list" ] || return 0
          xargs -0 -a "$list" "${hook[@]}" "${args[@]}" "$@" >> "$work/out" 2>&1 || status=1
        }
        : > "$work/out"
        scan "$work/strict"
        scan "$work/tolerated" --disable-plugin KeywordDetector
        # source code: the keyword findings are reported (annotation, job summary), they do not fail the scan
        if [ -s "$work/advice" ]; then
          xargs -0 -a "$work/advice" "${hook[@]}" "${args[@]}" > "$work/adv" 2>&1 || true
          awk -v gh="${GITHUB_ACTIONS:-}" -v rows="$work/rows" '/^Secret Type:/{t=$0; sub(/^Secret Type: */,"",t)} /^Location:/{if (t=="Secret Keyword") {l=$2; n++; print "  " l "  " t " (reported, not blocking)"; print "| `" l "` | " t " |" >> rows; if (gh) { split(l,a,":"); print "::warning file=" a[1] ",line=" a[2] "::" t " in source code: a name or a value? Reported, not blocking" }}} END{if (n) print n " keyword finding(s) in source code: reported, not blocking (check each is a name, not a value)"}' "$work/adv" || true
          if [ -s "$work/rows" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            { echo "### Secret scan: keywords in source code (not blocking)"; echo; echo "| Location | Kind |"; echo "| --- | --- |"; cat "$work/rows"; echo; echo "A variable named like a credential is reported, a literal value fails the scan only when it is a provider key or high-entropy. Settle with \`pragma: allowlist secret\`, the baseline, or \`keywords\`."; } >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        if [ "$status" -eq 0 ]; then echo "no possible secret"; exit 0; fi
        if grep -q '^Location:' "$work/out"; then
          level=error; [ "${MODE:-block}" = warn ] && level=warning
          awk -v gh="${GITHUB_ACTIONS:-}" -v level="$level" '/^Secret Type:/{t=$0; sub(/^Secret Type: */,"",t)} /^Location:/{l=$2; n++; print "  " l "  " t; if (gh) { split(l,a,":"); print "::" level " file=" a[1] ",line=" a[2] "::possible secret (" t ")" }} END{print n " possible secret(s)"}' "$work/out"
        else
          cat "$work/out"
        fi
        echo "Settle each one: a real secret is rotated first (it stays in the git history), then removed."
        echo "Not a secret: a pragma: allowlist secret comment on its line, or corral ci secrets --baseline (commit .secrets.baseline),"
        echo "or the tolerate input for a folder of test data (the keyword detector is skipped there, provider keys never are),"
        echo "or the keywords input (report: names in source code are only reported, config: not looked for there, off: never)."
        if [ "${MODE:-block}" = warn ]; then echo "mode warn: reported, not blocking"; exit 0; fi
        exit 1
