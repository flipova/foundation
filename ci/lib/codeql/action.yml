# corral-ci-lib codeql v1 sha256:cef8dce1627fb3b2
name: codeql
description: Deep static analysis (data-flow queries) with CodeQL. The results stay in the run (a SARIF artifact); nothing is uploaded to GitHub code scanning, so no extra token permission and no Advanced Security licence are needed for the upload.
inputs:
  languages:
    description: Languages to analyse (comma-separated)
    default: javascript-typescript
  queries:
    description: Query suite (default, security-extended or security-and-quality)
    default: security-extended
  fail-on:
    description: Lowest SARIF level that fails the step (error, warning or none)
    default: error
runs:
  using: composite
  steps:
    - name: Initialise CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ inputs.languages }}
        queries: ${{ inputs.queries }}
        build-mode: none
    - name: Analyse
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        upload: never
        output: codeql-results
    - name: Fail on findings
      shell: bash
      env:
        CODEQL_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        node - codeql-results <<'JS'
        const fs = require('fs');
        const dir = process.argv[2];
        const rank = { none: 9, note: 1, warning: 2, error: 3 };
        const limit = rank[process.env.CODEQL_FAIL_ON] ?? 3;
        let found = 0, worst = 0;
        for (const f of fs.readdirSync(dir).filter((x) => x.endsWith('.sarif'))) {
          const doc = JSON.parse(fs.readFileSync(`${dir}/${f}`, 'utf8'));
          for (const run of doc.runs ?? []) for (const r of run.results ?? []) {
            const level = r.level ?? 'warning';
            const loc = r.locations?.[0]?.physicalLocation;
            found++;
            worst = Math.max(worst, rank[level] ?? 2);
            console.log(`::${level === 'error' ? 'error' : 'warning'} file=${loc?.artifactLocation?.uri ?? ''},line=${loc?.region?.startLine ?? 1}::${r.ruleId}: ${(r.message?.text ?? '').split('\n')[0]}`);
          }
        }
        console.log(`${found} CodeQL finding(s)`);
        process.exit(worst >= limit && limit < 9 ? 1 : 0);
        JS
    - name: Keep the report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: codeql-report
        path: codeql-results
        if-no-files-found: ignore
