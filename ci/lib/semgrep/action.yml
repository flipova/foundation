# corral-ci-lib semgrep v1 sha256:e84fa51b36f378b9
name: semgrep
description: Static analysis with Semgrep, from the command line (nothing is uploaded to GitHub code scanning).
inputs:
  config:
    description: Semgrep rule set
    default: p/default
  severity:
    description: Lowest severity that fails the step (INFO, WARNING or ERROR)
    default: ERROR
  exclude:
    description: Space-separated paths to skip
    default: node_modules dist build coverage
runs:
  using: composite
  steps:
    - name: Semgrep
      shell: bash
      env:
        SEMGREP_CONFIG: ${{ inputs.config }}
        SEMGREP_SEVERITY: ${{ inputs.severity }}
        SEMGREP_EXCLUDE: ${{ inputs.exclude }}
      run: |
        set -euo pipefail
        args=()
        for p in $SEMGREP_EXCLUDE; do args+=(--exclude "$p"); done
        pipx run --spec semgrep==1.184.0 semgrep scan --config "$SEMGREP_CONFIG" --metrics=off --severity "$SEMGREP_SEVERITY" --error "${args[@]}" --sarif-output=semgrep.sarif
    - name: Keep the report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: semgrep-report
        path: semgrep.sarif
        if-no-files-found: ignore
