# corral-ci-lib docs-site v1 sha256:09d9609b0647afb7
name: docs-site
description: 'Builds a documentation site (Docusaurus, MkDocs, VitePress, any static generator: you give the commands) and, on a tag, hands the result to the pages job of the pipeline, which publishes it to GitHub Pages after a stable delivery. On a pull request it only builds, so a broken page fails the review.'
inputs:
  directory:
    description: 'Directory of the site (where the install and build commands run)'
    default: 'website'
  install:
    description: 'Command that installs the site dependencies'
    default: 'npm ci'
  build:
    description: 'Command that builds the site'
    default: 'npm run build'
  output:
    description: 'Directory the build produces, relative to the site directory'
    default: 'build'
  node-version:
    description: 'Node version used by the commands (empty - the one of the runner)'
    default: '22'
runs:
  using: composite
  steps:
    - name: Node
      if: inputs.node-version != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install the site dependencies
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        DOCS_INSTALL: ${{ inputs.install }}
      run: |
        set -euo pipefail
        bash -c "$DOCS_INSTALL"
    - name: Build the site
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        DOCS_BUILD: ${{ inputs.build }}
        DOCS_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        bash -c "$DOCS_BUILD"
        [ -d "$DOCS_OUTPUT" ] || { echo "::error::the build did not produce $DOCS_OUTPUT (output input)"; exit 1; }
        echo "site built in $DOCS_OUTPUT ($(find "$DOCS_OUTPUT" -type f | wc -l) files)"
    - name: Keep the site for the pages job
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ inputs.directory }}/${{ inputs.output }}
