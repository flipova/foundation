# CI contract: how THIS project does each standard step. The workflow (.github/workflows/release.yml) is generated from it:
# after editing, run `corral ci sync`. One of run | script | use | skip per step. See `corral help ci`.
version: 1
steps:
  install:
    run: npm ci
  format:
    run: npm run format:check
    blocking: false
  lint:
    run: |
      npm run lint
      npm run design:check
      npm run design:verify
      npm run design:lint
  typecheck:
    run: npm run typecheck
  codegen:
    run: npm run design:gen:check
  test:
    run: npm test
  build:
    run: |
      npm run build
      npm pack --dry-run
  audit:
    run: npm audit --json
    blocking: false
  sast:
    use: ci/lib/semgrep
  secrets:
    use: ci/lib/secrets
  codeql:
    use: ci/lib/codeql
  deps:
    use: ci/lib/dependency-review