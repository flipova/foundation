# Labels are applied to pull requests and issues from the files they touch.
# NOTE: only label names that already exist in the repository are used here,
# because actions/labeler fails the job when a configured label is unknown.

registry:
  - changed-files:
      - any-glob-to-any-file: "design/**"

tokens:
  - changed-files:
      - any-glob-to-any-file: "design/tokens.xml"

theme:
  - changed-files:
      - any-glob-to-any-file: "design/themes.xml"

components:
  - changed-files:
      - any-glob-to-any-file: "components/**"

config:
  - changed-files:
      - any-glob-to-any-file:
          - "tailwind.config.js"
          - "postcss.config.js"
          - "globals.css"
          - "tsup.config.ts"
          - "tsconfig.json"
          - "gluestack-ui.config.json"
          - "package.json"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

docs:
  - changed-files:
      - any-glob-to-any-file: "docs/**"