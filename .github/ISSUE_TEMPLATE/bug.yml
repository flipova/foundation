name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you saw, what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The shortest steps that show it.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Version and environment
      description: Version, operating system, browser or runtime.
    validations:
      required: false
