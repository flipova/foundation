# The single changeset for this cycle.
#
# `flow release` writes this file and generates `.changeset/release.md` from
# it. `flow release check` (run by CI) reports any drift between the two, so
# the declaration and what changesets actually reads cannot disagree.
#
# bump: major | minor | patch | none   (none = nothing to release)
bump: minor
summary: >-
  flipova-design adopt: an app copies the design registries into design/ (and only the registries),
  the manifest outputs are rewritten to theme/config.ts and theme/tokens.js, and theme/provider.tsx
  is created

  createGluestackUIProvider(theme) is exported from @flipova/foundation/ui, so an app mounts a
  provider built from its own generated theme; GluestackUIProvider remains the package theme

  design.js resolves the Python sources from the package instead of the registry directory, so an
  adopted copy without tools/ has a working generator
