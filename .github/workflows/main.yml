# Pipeline — branche main : release (qualité + publication npm).
#
# Promotion VERROUILLÉE : la seule source autorisée vers `main` est `staging`
# (ou une branche `hotfix/*`). Tout le reste est refusé.
#   dev  →  staging  →  main
#
# Publication par « trusted publishing » npm (OIDC) : aucun token, aucun secret.
# Le tag DOIT correspondre à la version de package.json — c'est ce qui rattache
# le paquet publié au versionnement (`flipova version tag vX.Y.Z`).
#
# Prérequis (une fois, côté npm) :
#   npm trust github @flipova/foundation --file main.yml \
#     --repository flipova/foundation --allow-publish
#
# Adapté du template flipova pour @flipova/foundation.
name: main

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false   # une publication ne se coupe pas

permissions:
  contents: read

env:
  AMONT: staging

jobs:
  promotion:
    name: promotion (source autorisée)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: La source doit etre l'amont autorise (ou un hotfix)
        run: |
          source="${GITHUB_HEAD_REF}"
          cible="${GITHUB_BASE_REF}"
          echo "source=$source  cible=$cible  amont=${AMONT}"
          case "$source" in
            "${AMONT}"|hotfix/*) echo "::notice::$source -> $cible accepte" ;;
            *)
              echo "::error::« $source » ne peut pas viser $cible : passe d'abord par ${AMONT}, ou ouvre une branche hotfix/*"
              exit 1
              ;;
          esac

  qualite:
    name: qualite (main)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: installation
        run: npm ci
      - name: lint (avis — ne bloque pas encore la CI)
        run: npm run lint --if-present
        continue-on-error: true
      - name: format (avis)
        run: npm run format:check --if-present
        continue-on-error: true
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: build
        run: npm run build
      - name: python (outils du registre de design)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: registre de design a jour (artefacts generes)
        run: |
          if [ -f design/tools/requirements.txt ]; then pip install -r design/tools/requirements.txt; fi
          npm run design:gen:check

  publier:
    name: publication npm
    needs: qualite
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: installation
        run: npm ci

      - name: Rattacher le tag a la version du paquet
        run: |
          paquet=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json=$paquet  tag=$tag"
          if [ "$paquet" != "$tag" ]; then
            echo "::error::le tag ($tag) ne correspond pas a la version du paquet ($paquet)"
            exit 1
          fi

      - name: La version est-elle deja publiee ?
        id: etat
        run: |
          nom=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$nom@$version" version >/dev/null 2>&1; then
            echo "publiee=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$nom@$version est deja sur le registre — publication ignoree"
          else
            echo "publiee=false" >> "$GITHUB_OUTPUT"
          fi

      - name: build
        run: npm run build

      - name: Publication npm (OIDC, sans token)
        if: steps.etat.outputs.publiee == 'false'
        run: npm publish --provenance --access public

      - name: Release GitHub (pre-release si alpha/beta/rc)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*|*-rc*) drapeau="--prerelease" ;;
            *) drapeau="" ;;
          esac
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} deja presente"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes $drapeau
          fi
