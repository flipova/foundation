name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Design registry gate.
  # The XML registries and their generated artifacts are part of the published
  # surface, so they are validated on every PR AND on every push to main.
  # Nothing can merge (or land on main) with a broken registry, a stale
  # generated file, or without a version decision.
  # ---------------------------------------------------------------------------
  design:
    name: Design registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - name: Install design tooling
        run: |
          python -m pip install --upgrade pip
          # Wheels only: building lxml from source needs the libxml2/libxslt
          # development headers, which the runners do not provide. Requiring a
          # wheel turns a missing one into a clear, short error here instead of
          # a long compile failure later in the job.
          python -m pip install --only-binary=:all: -r design/tools/requirements.txt

      # XSD conformance of every design XML
      - name: Lint (XSD)
        run: npm run design:lint

      # determinism rules declared in the manifest + ruff lint of the toolchain
      - name: Check (determinism rules)
        run: npm run design:check

      # the committed canonical index must match the registries
      - name: Verify canonical index
        run: npm run design:verify

      # generated artifacts (config.ts, tokens.js) must be up to date
      - name: No generation drift
        run: npm run design:gen -- --check

      - name: Detect published-surface changes
        id: surface
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/main...HEAD" \
            | grep -qE '^(design/|components/|index\.ts|tailwind\.config\.js|tsup\.config\.ts|package\.json)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The declaration is the one place the release decision is written down, and
      # both gates now read it. `bump: none` means "this change is not a release",
      # and it is the only spelling of that the repository accepts: an empty
      # changeset file is refused by `flow release check`, because a `none` bump
      # means there must be none.
      #
      # Without this step the two gates disagree on exactly the pull requests that
      # are documented as needing no release - a dev script added to
      # `package.json`, say - and there is then no way to pass both.
      - name: Read the release declaration
        id: declared
        if: github.event_name == 'pull_request'
        run: |
          # `origin/<base>` rather than the base sha: the step above already
          # depends on that ref being fetched, and a sha is not a ref.
          raw="$(git show "origin/${{ github.base_ref }}:.github/flow/release.yml" 2>/dev/null || true)"
          bump="$(printf '%s\n' "$raw" | sed -nE "s/^[[:space:]]*bump:[[:space:]]*[\"']?([^\"'[:space:]]+)[\"']?[[:space:]]*$/\1/p" | head -1)"
          # Unknown, not none: a missing or unreadable declaration must keep the
          # requirement rather than quietly excuse it.
          echo "bump=${bump:-unknown}" >> "$GITHUB_OUTPUT"
          echo "declared bump: ${bump:-unknown}"

      # A change to the published surface must come with a version decision.
      # `--since` uses the pull request base sha rather than a branch name, so
      # the check never depends on a remote-tracking ref being fetched.
      #
      # The changesets release pull request is exempt: it *consumes* the
      # changesets (they are deleted by design) and its own release decision is
      # the version bump it carries.
      - name: Require a changeset
        if: >-
          github.event_name == 'pull_request' &&
          steps.surface.outputs.changed == 'true' &&
          steps.declared.outputs.bump != 'none' &&
          !startsWith(github.event.pull_request.head.ref, 'changeset-release/') &&
          github.event.pull_request.title != 'chore: version packages'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npx changeset status --since="$BASE_SHA"
