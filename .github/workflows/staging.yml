# Pipeline — branche staging : validation large avant la release.
#
# Promotion VERROUILLÉE : la seule source autorisée vers `staging` est `dev`
# (ou une branche `hotfix/*`). Tout le reste est refusé.
#
# Adapté du template flipova pour @flipova/foundation : on ajoute ici les
# garde-fous lourds (registre de design complet, documentation, paquet npm).
name: staging

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Branche amont autorisée à promouvoir vers cette branche. `hotfix/*` est toujours permis.
  AMONT: dev

jobs:
  promotion:
    name: promotion (source autorisée)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: La source doit etre l'amont autorise (ou un hotfix)
        run: |
          source="${GITHUB_HEAD_REF}"
          cible="${GITHUB_BASE_REF}"
          echo "source=$source  cible=$cible  amont=${AMONT}"
          case "$source" in
            "${AMONT}"|hotfix/*) echo "::notice::$source -> $cible accepte" ;;
            *)
              echo "::error::« $source » ne peut pas viser $cible : passe d'abord par ${AMONT}, ou ouvre une branche hotfix/*"
              exit 1
              ;;
          esac

  qualite:
    name: qualite (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: installation
        run: npm ci
      - name: lint
        run: npm run lint --if-present
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: build
        run: npm run build

      - name: python (outils du registre de design)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pipeline de design complet (gen + check + verify + lint + doc)
        run: |
          if [ -f design/tools/requirements.txt ]; then pip install -r design/tools/requirements.txt; fi
          npm run design:pipeline

      - name: documentation (Docusaurus)
        run: npm --prefix docs ci && npm --prefix docs run build

      - name: paquet npm publiable (contenu du tarball)
        run: npm pack --dry-run

      - name: dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error
