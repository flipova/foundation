# Pipeline — branche staging : tests plus larges.
#
# Promotion VERROUILLÉE : la seule source autorisée vers `staging` est `dev`
# (ou une branche `hotfix/*`). Tout le reste est refusé.
#   dev  →  staging  →  main
#
# Template fourni par le starter flipova ; copié dans le dépôt puis adapté librement.
name: staging

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

env:
  # Branche amont autorisée à promouvoir vers cette branche. `hotfix/*` est toujours permis.
  AMONT: dev

jobs:
  promotion:
    name: promotion (source autorisée)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: La source doit etre l'amont autorise (ou un hotfix)
        run: |
          source="${GITHUB_HEAD_REF}"
          cible="${GITHUB_BASE_REF}"
          echo "source=$source  cible=$cible  amont=${AMONT}"
          case "$source" in
            "${AMONT}"|hotfix/*) echo "::notice::$source -> $cible accepte" ;;
            *)
              echo "::error::« $source » ne peut pas viser $cible : passe d'abord par ${AMONT}, ou ouvre une branche hotfix/*"
              exit 1
              ;;
          esac

  qualite:
    name: qualite (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
