# Pipeline — branche staging (tests plus larges).
# Template fourni par le starter flipova, copié dans le dépôt puis adapté librement.
name: staging

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
