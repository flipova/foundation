name: Shared - Security

# SÃ©curitÃ© universelle : secrets, vulnÃ©rabilitÃ©s/misconfig, CodeQL (si Ã©ligible),
# Dependency Review (PR), audit des workflows, Scorecard (optionnel).
# Chaque contrÃ´le non applicable est ignorÃ© avec un message explicite.
#
# Variables de dÃ©pÃ´t optionnelles :
#   ENABLE_CODEQL=true             forcer CodeQL sur dÃ©pÃ´t privÃ© (GitHub Code Security requis)
#   ENABLE_DEPENDENCY_REVIEW=true  forcer Dependency Review sur dÃ©pÃ´t privÃ©
on:
  workflow_call:
    inputs:
      severity:
        description: "SÃ©vÃ©ritÃ©s Trivy bloquantes"
        type: string
        default: "HIGH,CRITICAL"
      trivy_blocking:
        type: boolean
        default: true
      scorecard:
        description: "ExÃ©cuter OpenSSF Scorecard (dÃ©pÃ´t public, branche par dÃ©faut)"
        type: boolean
        default: false
      fail_on_severity:
        description: "Seuil Dependency Review (low, moderate, high, critical)"
        type: string
        default: "high"

permissions: {}

jobs:
  detect:
    name: DÃ©tection des contrÃ´les applicables
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      codeql: ${{ steps.d.outputs.codeql }}
      codeql_matrix: ${{ steps.d.outputs.codeql_matrix }}
      depreview: ${{ steps.d.outputs.depreview }}
      workflows: ${{ steps.d.outputs.workflows }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: d
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ENABLE_CODEQL: ${{ vars.ENABLE_CODEQL }}
          ENABLE_DEPREVIEW: ${{ vars.ENABLE_DEPENDENCY_REVIEW }}
        run: |
          set -euo pipefail
          PRIVATE="$(gh api "repos/$REPO" --jq .private 2>/dev/null || echo unknown)"

          # --- Workflows prÃ©sents (zizmor)
          if [ -n "$(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | head -n1 || true)" ]; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Security skipped::zizmor ignorÃ© : aucun workflow GitHub Actions"
          fi

          # --- Dependency Review (PR uniquement)
          if [ "$EVENT" != "pull_request" ]; then
            echo "depreview=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Security skipped::Dependency Review ignorÃ© : rÃ©servÃ© aux Ã©vÃ©nements pull_request"
          elif [ "$PRIVATE" = "false" ] || [ "$ENABLE_DEPREVIEW" = "true" ]; then
            echo "depreview=true" >> "$GITHUB_OUTPUT"
          else
            echo "depreview=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Security skipped::Dependency Review ignorÃ© : dÃ©pÃ´t privÃ© sans GitHub Code Security (dÃ©finir la variable ENABLE_DEPENDENCY_REVIEW=true si disponible)"
          fi

          # --- CodeQL : langages dÃ©tectÃ©s
          if [ "$PRIVATE" != "false" ] && [ "$ENABLE_CODEQL" != "true" ]; then
            echo "codeql=false" >> "$GITHUB_OUTPUT"
            echo 'codeql_matrix=[]' >> "$GITHUB_OUTPUT"
            echo "::warning title=Security skipped::CodeQL ignorÃ© : dÃ©pÃ´t privÃ© sans GitHub Code Security (dÃ©finir ENABLE_CODEQL=true si disponible)"
            exit 0
          fi
          LANGS="$(gh api "repos/$REPO/languages" --jq 'keys[]' 2>/dev/null || true)"
          ITEMS='[]'
          add() { ITEMS="$(jq -c --arg l "$1" --arg b "$2" '. + [{language:$l, build_mode:$b}]' <<<"$ITEMS")"; }
          grep -qxE 'JavaScript|TypeScript' <<<"$LANGS" && add javascript-typescript none || true
          grep -qx 'Python' <<<"$LANGS" && add python none || true
          grep -qx 'Go' <<<"$LANGS" && add go autobuild || true
          grep -qxE 'Java|Kotlin' <<<"$LANGS" && add java-kotlin none || true
          grep -qx 'C#' <<<"$LANGS" && add csharp none || true
          grep -qx 'Ruby' <<<"$LANGS" && add ruby none || true
          grep -qxE 'C|C\+\+' <<<"$LANGS" && add c-cpp none || true
          grep -qx 'Rust' <<<"$LANGS" && add rust none || true
          if [ -n "$(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | head -n1 || true)" ]; then
            ITEMS="$(jq -c '. + [{language:"actions", build_mode:"none"}]' <<<"$ITEMS")"
          fi
          if grep -qx 'Swift' <<<"$LANGS"; then
            echo "::notice title=Security skipped::CodeQL Swift ignorÃ© (runner macOS requis)"
          fi
          if [ "$(jq length <<<"$ITEMS")" -eq 0 ]; then
            echo "codeql=false" >> "$GITHUB_OUTPUT"
            echo 'codeql_matrix=[]' >> "$GITHUB_OUTPUT"
            echo "::notice title=Security skipped::CodeQL ignorÃ© : aucun langage pris en charge dÃ©tectÃ©"
          else
            echo "codeql=true" >> "$GITHUB_OUTPUT"
            echo "codeql_matrix=$ITEMS" >> "$GITHUB_OUTPUT"
          fi

  secrets:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks (vÃ©rification du checksum)
        shell: bash
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $tarball\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scanner
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          opts=()
          if [ "$EVENT" = "pull_request" ]; then
            opts=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          elif [ -n "${BEFORE:-}" ] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            opts=(--log-opts="${BEFORE}..${SHA}")
          else
            echo "::notice title=gitleaks::pas de point de comparaison : scan de tout l'historique"
          fi
          set +e
          gitleaks git --redact --no-banner -v \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json" \
            "${opts[@]}"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error title=gitleaks::des secrets potentiels ont Ã©tÃ© dÃ©tectÃ©s (rapport en artefact, valeurs masquÃ©es)"
          fi
          exit "$rc"
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 14

  trivy-fs:
    name: Trivy (vulnÃ©rabilitÃ©s, secrets, configuration)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: ${{ inputs.trivy_blocking && '1' || '0' }}
          format: table
          skip-dirs: node_modules,.git,vendor

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: detect
    if: needs.detect.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    # PR de fork : le token est en lecture seule, l'upload SARIF ne peut pas aboutir
    continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.codeql_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    needs: detect
    if: needs.detect.outputs.depreview == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: ${{ inputs.fail_on_severity }}
          comment-summary-in-pr: on-failure

  zizmor:
    name: zizmor (audit des workflows)
    needs: detect
    if: needs.detect.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@e673c3917a1aef3c65c972347ed84ccd013ecda4 # v0.2.0
        with:
          advanced-security: false
          min-severity: medium

  scorecard:
    name: OpenSSF Scorecard
    if: inputs.scorecard && github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
          category: scorecard
