name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The "a changeset is required" rule is enforced as a hard gate by the
  # `Design registry` job in ci.yml, scoped to the published surface
  # (design/, components/, package.json, entry points). It is intentionally not
  # duplicated here: a soft `continue-on-error` check would only add noise.

  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  # `actions/labeler` fails outright on an unknown label, so a label deleted by
  # hand would break every pull request. `.github/labels.yml` is the source of
  # truth: this check names what is missing and how to recreate it.
  labels:
    name: Automation labels present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the labels the automation relies on
        run: node .github/scripts/labels.mjs --check

  # The tracker and the single changeset are both declared inside the
  # repository (`.github/issues/*.yml`, `.github/flow/release.yml`). These
  # checks keep them in step with GitHub and with what `changeset version`
  # actually reads, so a deleted issue or a hand-edited changeset is reported
  # by name instead of quietly breaking the release.
  flow:
    name: Flow state in sync
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exactly one changeset, in step with its declaration
        run: node .github/scripts/flow.mjs release check
      - name: Verify the declared issues exist and match GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/flow.mjs issue check

  size:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/xs"
          xs_max_size: 10
          s_label: "size/s"
          s_max_size: 50
          m_label: "size/m"
          m_max_size: 200
          l_label: "size/l"
          l_max_size: 500
          xl_label: "size/xl"