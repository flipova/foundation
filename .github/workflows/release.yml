# Pipeline — branche main : PRODUCTION (livraison du livrable du dépôt).
#
# `main` n'est PAS réservé aux paquets npm : c'est la branche de PRODUCTION.
# Tout ce qui est publié, déployé ou livré passe par ici, sur tag `v*`.
# Pour @flipova/foundation le livrable EST le paquet npm — il est déclaré dans
# le script `deploy` de package.json ; la CI ne fait que l'appeler.
#
# Promotion VERROUILLÉE : la seule source autorisée vers `main` est `staging`
# (ou une branche `hotfix/*`). Tout le reste est refusé.
#   dev  →  staging  →  main
#
# Adapté du template flipova pour @flipova/foundation.
name: release

on:
  push:
    branches: [main, alpha, beta, rc]
    tags: ['v*']
  pull_request:
    branches: [main, alpha, beta, rc]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # une livraison ne se coupe pas

permissions:
  contents: read

jobs:
  promotion:
    name: promotion (source autorisee)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: La source doit etre l'amont autorise (ou un hotfix)
        run: |
          source="${GITHUB_HEAD_REF}"
          cible="${GITHUB_BASE_REF}"
          case "$cible" in
            alpha) amont="dev" ;;
            beta)  amont="alpha" ;;
            rc)    amont="beta" ;;
            main)  amont="rc staging" ;;
            *)     amont="" ;;
          esac
          echo "source=$source  cible=$cible  amont=$amont"
          for ok in $amont; do
            if [ "$source" = "$ok" ]; then echo "::notice::$source -> $cible accepte"; exit 0; fi
          done
          case "$source" in
            hotfix/*) echo "::notice::hotfix $source -> $cible accepte"; exit 0 ;;
          esac
          echo "::error::« $source » ne peut pas viser $cible : passe d'abord par « $amont », ou ouvre une branche hotfix/*"
          exit 1

  qualite:
    name: qualite (${{ github.base_ref || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: installation
        run: npm ci
      - name: lint
        run: npm run lint --if-present
      - name: format
        run: npm run format:check --if-present
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: build
        run: npm run build
      - name: python (outils du registre de design)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: registre de design a jour (artefacts generes)
        run: |
          if [ -f design/tools/requirements.txt ]; then pip install -r design/tools/requirements.txt; fi
          npm run design:gen:check

  codeql:
    name: analyse securite (CodeQL)
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # requis pour publier les resultats CodeQL
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  livrer:
    name: livraison (production)
    needs: codeql
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      id-token: write # OIDC : trusted publishing npm, sans token ni secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: installation
        run: npm ci

      - name: npm recent + registre (le trusted publishing OIDC exige npm >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm config set registry https://registry.npmjs.org/   # sinon setup-node ecrit un "always-auth" obsolete
          npm --version

      - name: Rattacher le tag au versionnement (si le depot est versionne)
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').version ? 0 : 1)" 2>/dev/null; then
            version=$(node -p "require('./package.json').version")
            tag="${GITHUB_REF_NAME#v}"
            echo "version du depot=$version  tag=$tag"
            if [ "$version" != "$tag" ]; then
              echo "::error::le tag ($tag) ne correspond pas a la version du depot ($version)"
              exit 1
            fi
          else
            echo "::notice::depot non versionne — controle tag <-> version ignore"
          fi

      - name: build
        run: npm run build

      - name: Livrer (script « deploy » du depot)
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.deploy ? 0 : 1)" 2>/dev/null; then
            version=$(node -p "require('./package.json').version")
            case "$version" in
              *-alpha*) tag=alpha ;;
              *-beta*)  tag=beta ;;
              *-rc*)    tag=rc ;;
              *)        tag=latest ;;
            esac
            echo "::notice::livraison via « npm run deploy -- --tag $tag »"
            if ! npm run deploy -- --tag "$tag"; then
              echo "::error::la livraison a echoue. Si le journal ci-dessus contient ENEEDAUTH, le registre n'a pas de « trusted publisher » OIDC declare pour ce depot. Remede :"
              echo "::error::  npm trust github ${{ github.repository }} --file main.yml --allow-publish"
              echo "::error::  (ou : npmjs.com > paquet > Settings > Trusted Publisher > GitHub Actions)"
              exit 1
            fi
          else
            echo "::notice::aucun script « deploy » — rien a livrer (release GitHub uniquement)"
          fi

      - name: Release GitHub (pre-release si alpha/beta/rc)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*|*-rc*) drapeau="--prerelease" ;;
            *) drapeau="" ;;
          esac
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} deja presente"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes $drapeau
          fi
