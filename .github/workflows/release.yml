name: Release

# Mandatory path to a release:
#
#   PR (any branch)  ->  main  ->  changesets opens/updates the
#   "chore: version packages" PR  ->  merging THAT PR is what publishes.
#
# Nothing is published from an ordinary commit on main: the preflight below
# refuses it. The only exception is an explicit, reasoned hotfix dispatch.
#
# On publish, authentication is either:
#
#   - trusted publishing (OIDC), when no NPM_PUBLISH_TOKEN secret is set. npm
#     exchanges the workflow's OIDC identity for a short-lived registry token:
#     no secret to rotate, and no two-factor prompt. This is the mode npm
#     recommends, and the one that survives the January 2027 removal of direct
#     publishing with bypass-2FA tokens.
#   - the NPM_PUBLISH_TOKEN secret, kept as a fallback during the transition.
#     It must be an npm automation token: a classic token authenticates and can
#     read, then is refused at publish with EOTP when the account has 2FA on
#     writes. No npm command reveals that before publishing.
#
# npm states that `npm whoami` and `npm access` are not a check of trusted
# publishing permissions, so the preflight runs them only in token mode.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hotfix:
        description: 'Hotfix release: publish without the changesets version PR (emergency only)'
        type: boolean
        default: false
      reason:
        description: 'Why the hotfix path is used (mandatory when hotfix = true)'
        type: string
        default: ''

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: https://registry.npmjs.org/

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      will_publish: ${{ steps.plan.outputs.will_publish }}
      path: ${{ steps.plan.outputs.path }}
      auth_mode: ${{ steps.auth.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install design tooling
        run: |
          python -m pip install --upgrade pip
          # Wheels only: building lxml from source needs the libxml2/libxslt
          # development headers, which the runners do not provide. Requiring a
          # wheel turns a missing one into a clear, short error here instead of
          # a long compile failure later in the job.
          python -m pip install --only-binary=:all: -r design/tools/requirements.txt

      # The registry is the published surface: it must be valid and in sync
      # before anything is released.
      - name: Repository gates
        run: |
          npm run design:lint
          npm run design:check
          npm run design:verify
          npm run design:gen -- --check
          npm run typecheck

      # Which authentication the publish will use.
      #
      # `oidc` when there is no token secret: npm exchanges the workflow's OIDC
      # identity, through GitHub, for a short-lived registry token. `token`
      # otherwise.
      #
      # The two need different checks. npm is explicit that `npm whoami` and
      # `npm access` are *not* a check of trusted publishing permissions, and that
      # they still require traditional authentication - so running them in OIDC
      # mode would fail a run that would have published perfectly.
      - name: Decide the authentication mode
        id: auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Authentication: the NPM_PUBLISH_TOKEN secret."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "Authentication: trusted publishing (OIDC), no token."
            # The OIDC capability is NOT checked here. `id-token: write` is only
            # granted to the job that publishes, and ACTIONS_ID_TOKEN_REQUEST_URL
            # only exists there - so checking it in this job always fails, and
            # widening this job's permissions to make it pass would be wrong.
            # The guard lives in the changesets job, where the token is used.
          fi

      - name: Decide the release path
        id: plan
        env:
          HOTFIX: ${{ inputs.hotfix }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          subject="$(git log -1 --pretty=%s)"
          pending="$(ls .changeset/*.md 2>/dev/null | grep -vc README || true)"
          # Which commit produced the version currently in package.json?
          #
          # Not `git log -1`: on a repository that merges pull requests the tip
          # is always "Merge pull request #N from ...", so a tip check refuses
          # every single publish - which is exactly what 2.0.1 did. The pickaxe
          # asks the question that actually matters: did the changesets version
          # commit write this version?
          bump="$(git log -1 --format=%s -S"\"version\": \"$version\"" -- package.json 2>/dev/null || true)"
          {
            echo "### Release preflight"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| package | \`$name\` |"
            echo "| local version | \`$version\` |"
            echo "| last commit | \`$subject\` |"
            echo "| version commit | \`${bump:-not found}\` |"
            echo "| pending changesets | $pending |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Every branch below announces the same three things: the path it
          # picked, whether that path publishes, and one line a reader sees in
          # the Checks tab without opening the log. Before this existed, a green
          # run that had decided "nothing to publish" looked exactly like a
          # green run that published - which is how 2.0.1 to 2.0.3 stayed quiet.
          decide() {
            echo "path=$1" >> "$GITHUB_OUTPUT"
            echo "will_publish=$2" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release decision::$3"
            { echo "**Decision:** $3"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$HOTFIX" = "true" ]; then
            if [ -z "$REASON" ]; then
              echo "::error::hotfix = true requires the 'reason' input."
              exit 1
            fi
            echo "Hotfix path accepted (reason: $REASON)."
            decide hotfix true "hotfix: publishing ${name}@${version} without the changelog gate."
            exit 0
          fi

          # Already on the registry: nothing to do, and that is not a failure.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published - nothing to do."
            decide already-published false "${name}@${version} is already on npm - nothing to publish."
            exit 0
          fi

          if [ "$pending" -gt 0 ]; then
            echo "Changesets pending ($pending) -> the Version Packages PR will be opened/updated. No publish here."
            decide version-pr false "$pending change(s) pending: the 'chore: version packages' pull request will be opened or updated. No publish here."
            exit 0
          fi

          # Which commit wrote the current version? Diagnostic only.
          #
          # This used to be the gate, and that was wrong twice over: `git log -1`
          # is always a merge subject here, and a squash merge of the version pull
          # request replaces `chore: version packages` with its own title. Both were
          # found by merging for real.
          echo "version commit: ${bump:-not found}"

          # The gate is the changelog entry. `changeset version` always writes
          # `## <version>` for the version it produced; a hand-bumped package.json
          # does not. That survives any merge strategy, which a commit subject does not.
          if git show HEAD:CHANGELOG.md 2>/dev/null | grep -q "^## ${version}$"; then
            echo "CHANGELOG.md has an entry for ${version}: it was produced by changeset version."
          else
            echo "::error::Refusing to publish."
            echo "::error::CHANGELOG.md has no '## ${version}' entry."
            echo "::error::Nothing produced this version through changeset version, so it must not be"
            echo "::error::published. Merge the 'chore: version packages' pull request, or dispatch"
            echo "::error::this workflow with hotfix = true and a reason."
            exit 1
          fi

          decide version-pr true "CHANGELOG.md has '## ${version}' - publishing ${name}@${version}."

      # Fail BEFORE touching the registry, with an actionable message instead of
      # a bare E404 at the end of the publish.
      - name: Verify registry authentication and write access
        if: steps.plan.outputs.will_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # The .npmrc is written here, before changesets/action runs.
          #
          # The action only creates one when it finds none, so this file is what
          # decides the authentication. An `_authToken` line takes precedence
          # over OIDC and breaks it, so in OIDC mode the file carries the
          # registry and no credential at all.
          if [ "$AUTH_MODE" = "token" ]; then
            {
              echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
              echo "always-auth=true"
              echo "registry=${REGISTRY}"
            } > .npmrc
          else
            echo "registry=${REGISTRY}" > .npmrc
          fi

          if [ "$AUTH_MODE" = "oidc" ]; then
            echo "::notice::Publishing ${name}@${version} with trusted publishing (OIDC); no token is configured."
            echo "::notice::npm whoami and npm access are not a check of trusted publishing permissions, so they are deliberately skipped."
            {
              echo ""
              echo "### Authentication"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| mode | \`oidc\` (trusted publishing, no token) |"
              echo "| package | \`$name\` |"
              echo "| version | \`$version\` |"
              echo ""
              echo "> npm states that \`npm whoami\` and \`npm access\` are not a check of trusted"
              echo "> publishing permissions, and still require traditional authentication."
              echo "> The publish itself is the only real check."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "About to publish ${name}@${version} with OIDC."
            exit 0
          fi

          if ! who="$(npm whoami --registry="${REGISTRY}" 2>&1)"; then
            echo "::error::npm authentication failed: ${who}"
            echo "::error::NPM_PUBLISH_TOKEN is most likely not an npm token (a GitHub Packages token fails exactly like this), expired, or a classic token - npm now requires an automation token."
            exit 1
          fi
          echo "Authenticated on ${REGISTRY} as ${who}"
          status="$(npm access get status "$name" --registry="${REGISTRY}" 2>&1 || true)"
          echo "Write status on ${name}: ${status}"
          if echo "$status" | grep -qi 'not authorized\|E404'; then
            echo "::error::The token cannot publish ${name}. Grant it write access to the @flipova scope (or to the ${name} package)."
            exit 1
          fi
          echo "About to publish ${name}@${version}."

  changesets:
    name: Version PR / Publish
    needs: preflight
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one, so it has to repeat what
    # this job needs. `packages: write` is dropped on purpose: this package is
    # published to npmjs.org, never to GitHub Packages.
    permissions:
      contents: write          # commit the version bump and open the version PR
      pull-requests: write     # create or update the version PR
      id-token: write          # trusted publishing: GitHub signs the OIDC token
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.changesets.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      # The version bump also regenerates the documentation, so the
      # "chore: version packages" PR can never be inconsistent with package.json.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install design tooling
        run: |
          python -m pip install --upgrade pip
          # Wheels only: building lxml from source needs the libxml2/libxslt
          # development headers, which the runners do not provide. Requiring a
          # wheel turns a missing one into a clear, short error here instead of
          # a long compile failure later in the job.
          python -m pip install --only-binary=:all: -r design/tools/requirements.txt

      # `id-token: write` is granted to THIS job and to no other, so this is the
      # only place the OIDC capability can be observed. Checked here rather than
      # in the preflight, which cannot see it - see the note in the preflight's
      # authentication step.
      - name: Check that trusted publishing is available
        if: needs.preflight.outputs.auth_mode == 'oidc'
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::Trusted publishing needs 'id-token: write' on this job, and this job does not have it."
            echo "::error::Without it GitHub issues no OIDC token and npm has nothing to authenticate with."
            echo "::error::Either add the permission to the changesets job, or restore the NPM_PUBLISH_TOKEN secret."
            exit 1
          fi
          echo "OIDC is available; npm will exchange it for a short-lived registry token."

      # Trusted publishing needs npm 11.5.1+ (11.21+ for dist-tags) and Node
      # 22.14+. `actions/setup-node` gives us Node 22.x but keeps the npm that
      # ships with it, which is 10.9.x - old enough that the OIDC exchange does
      # not exist and the publish fails with an authentication error that says
      # nothing about the npm version.
      - name: Upgrade npm for trusted publishing
        if: needs.preflight.outputs.auth_mode == 'oidc'
        run: |
          npm install -g npm@latest
          echo "npm $(npm -v)"

      # changesets/action only writes a .npmrc when it finds none, so this file
      # decides the authentication. An `_authToken` line would take precedence
      # over OIDC, so in OIDC mode it carries the registry and no credential.
      - name: Configure registry authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          AUTH_MODE: ${{ needs.preflight.outputs.auth_mode }}
        run: |
          set -euo pipefail
          if [ "$AUTH_MODE" = "token" ]; then
            {
              echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
              echo "always-auth=true"
              echo "registry=${REGISTRY}"
            } > .npmrc
          else
            echo "registry=${REGISTRY}" > .npmrc
          fi
          cat .npmrc | sed 's/^/  /'

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version:bump
          publish: npm run release:ci
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The switch between the two modes. The action only reads it to build a
          # .npmrc, and the step above has already written one, so nothing here
          # decides the credentials - the absence of this secret does.
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
