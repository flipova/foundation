# Pipeline — branche dev : porte d'entrée du cycle (développement précoce).
#
# Toute branche peut viser `dev`. La suite est verrouillée :
#   dev  →  staging  →  main        (seuls les hotfix/* peuvent court-circuiter)
#
# Template fourni par le starter flipova ; copié dans le dépôt puis adapté librement.
name: dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: qualite (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
