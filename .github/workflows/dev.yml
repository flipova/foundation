# Pipeline — branche dev : porte d'entrée du cycle (développement précoce).
#
# Toute branche peut viser `dev`. La suite est verrouillée :
#   dev  →  staging  →  main        (seuls les hotfix/* peuvent court-circuiter)
#
# Adapté du template flipova pour @flipova/foundation.
name: dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: qualite (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: installation
        run: npm ci
      - name: lint
        run: npm run lint --if-present
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: build
        run: npm run build
      - name: registre de design a jour (artefacts generes)
        run: npm run design:gen:check
