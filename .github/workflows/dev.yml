# Pipeline — branche dev : porte d'entrée du cycle (développement précoce).
#
# Toute branche peut viser `dev`. La suite est verrouillée :
#   dev  →  staging  →  main        (seuls les hotfix/* peuvent court-circuiter)
#
# Adapté du template flipova pour @flipova/foundation.
name: dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  promotion:
    name: promotion (branche de travail)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Les modifs passent par une branche dediee (jamais dev/staging/main en direct)
        run: |
          source="${GITHUB_HEAD_REF}"
          cible="${GITHUB_BASE_REF}"
          echo "source=$source  cible=$cible"
          case "$source" in
            dev|staging|main|master)
              echo "::error::« $source » ne peut pas viser $cible : ouvre une branche de travail (feature/*, fix/*, chore/*, hotfix/*)"
              exit 1
              ;;
            *) echo "::notice::$source -> $cible accepte" ;;
          esac

  qualite:
    name: qualite (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: installation
        run: npm ci
      - name: lint
        run: npm run lint --if-present
      - name: format
        run: npm run format:check --if-present
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: build
        run: npm run build
      - name: python (outils du registre de design)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: registre de design a jour (artefacts generes)
        run: |
          if [ -f design/tools/requirements.txt ]; then pip install -r design/tools/requirements.txt; fi
          npm run design:gen:check
