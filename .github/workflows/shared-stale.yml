name: Shared - Stale

on:
  workflow_call:
    inputs:
      days_before_stale:
        type: number
        default: 60
      days_before_close:
        type: number
        default: 14
      exempt_labels:
        type: string
        default: "pinned,security,roadmap,status: blocked"

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10
        with:
          days-before-stale: ${{ inputs.days_before_stale }}
          days-before-close: ${{ inputs.days_before_close }}
          stale-issue-label: "status: stale"
          stale-pr-label: "status: stale"
          exempt-issue-labels: ${{ inputs.exempt_labels }}
          exempt-pr-labels: ${{ inputs.exempt_labels }}
          exempt-all-milestones: true
          exempt-draft-pr: true
          remove-stale-when-updated: true
          operations-per-run: 200
          stale-issue-message: "Cette issue est inactive depuis ${{ inputs.days_before_stale }} jours. Elle sera fermée dans ${{ inputs.days_before_close }} jours sans activité."
          stale-pr-message: "Cette PR est inactive depuis ${{ inputs.days_before_stale }} jours. Elle sera fermée dans ${{ inputs.days_before_close }} jours sans activité."
          close-issue-message: "Fermée pour inactivité. N'hésite pas à la rouvrir."
          close-pr-message: "Fermée pour inactivité. N'hésite pas à la rouvrir."
