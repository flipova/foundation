name: PR

# Porte d'entrée AVANT dev (et contrôles sur les PR de promotion vers staging / main).
# Remplace flipova par ton organisation ; épingle @v1 (ou un SHA) selon ta politique.
on:
  pull_request:
    branches: [dev, staging, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  actions: read
  security-events: write
  statuses: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    uses: ./.github/workflows/shared-pr-gate.yml
    with:
      require_linked_issue: false

  quality:
    uses: ./.github/workflows/shared-quality.yml

  # CodeQL et Scorecard demandent `id-token: write` et `actions: read`, que le
  # niveau workflow n'accorde pas. Un job appelé ne peut pas demander plus que son
  # appelant : sans ce bloc, GitHub refuse le fichier entier.
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
      # `dependency-review` commente la PR : sans ce droit, GitHub refuse le fichier.
      pull-requests: write
    uses: ./.github/workflows/shared-security.yml

  test:
    uses: ./.github/workflows/shared-test.yml

  version-preview:
    uses: ./.github/workflows/shared-version.yml

  # Check unique à rendre OBLIGATOIRE dans le ruleset (nom stable : "PR gate")
  pr-gate:
    name: PR gate
    if: always()
    needs: [conventions, quality, security, test, version-preview]
    uses: ./.github/workflows/shared-gate.yml
    with:
      needs_json: ${{ toJSON(needs) }}
      required: conventions,quality,security
      title: PR gate
