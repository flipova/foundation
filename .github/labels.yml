# Labels used by the repository automation - the single source of truth.
#
# `flow labels` (the script behind it: .github/scripts/labels.mjs) reads it to:
#   --check      verify every label exists AND `.github/labeler.yml` is up to date
#   --sync-labeler  regenerate `.github/labeler.yml` from the `paths` below
#   --create     create the labels missing in the repository
#
# Why one file: `actions/labeler` fails outright on an unknown label, so a
# hand-written labeler could reference a label that does not exist, or use a
# label the workflow never creates. Here the labels and the paths that trigger
# them cannot drift apart.
#
# `paths` is optional: a label without paths is applied by hand.
# colors: GitHub hex, without the leading '#'.
#
#   flow labels --list
#   flow labels --check
#   flow labels --sync-labeler
#   GITHUB_TOKEN=<pat> flow labels --create

labels:
  # --- applied automatically from the files a pull request touches -----------
  - name: registry
    color: "5319E7"
    description: Design registry (design/**)
    paths:
      - "design/**"

  - name: tokens
    color: "0B7285"
    description: Design tokens (design/tokens.xml)
    paths:
      - "design/tokens.xml"

  - name: theme
    color: "5F3DC4"
    description: Themes and semantic roles (design/themes.xml)
    paths:
      - "design/themes.xml"

  - name: components
    color: "1864AB"
    description: gluestack components (components/**)
    paths:
      - "components/**"

  - name: config
    color: "495057"
    description: Build, Tailwind and package configuration
    paths:
      - "tailwind.config.js"
      - "postcss.config.js"
      - "globals.css"
      - "tsup.config.ts"
      - "tsconfig.json"
      - "gluestack-ui.config.json"
      - "package.json"

  - name: ci
    color: "212529"
    description: CI and release workflow (.github/**)
    paths:
      - ".github/**"

  - name: docs
    color: "087F5B"
    description: Documentation site (docs/**)
    paths:
      - "docs/**"

  # --- applied by hand: they tell a bot what to do --------------------------
  - name: "changeset:major"
    color: "E03131"
    description: Breaking release - the public API changes

  - name: "changeset:minor"
    color: "F76707"
    description: Additive release

  - name: "changeset:patch"
    color: "2F9E44"
    description: Internal fix, no public API change

  - name: "changeset:none"
    color: "CED4DA"
    description: Real change that needs no release

  - name: no-issue
    color: "868E96"
    description: Trivial change that needs no linked issue

  - name: needs-triage
    color: "F59F00"
    description: Waiting for triage

  - name: stale
    color: "ADB5BD"
    description: No activity for a while