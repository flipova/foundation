id: collaboration-automation
title: "Collaboration flow: issue linkage, concurrency, merges, changeset automation"
labels:
  - ci
  - docs
body: |
  Make the contribution flow usable when several people work in parallel.

  ## Scope
  - issue forms (bug, feature) replacing the templates that still described the
    removed architecture; they ask for the version and the affected layer;
  - a pull request template requiring a linked issue and a declared release
    decision;
  - `pr-lifecycle.yml`: refuses a pull request that references no issue or that
    conflicts with its base, merges the base into a branch that fell behind (only
    when clean, never on a fork), keeps a single up-to-date status comment, and
    enables squash auto-merge once everything is green;
  - `changeset-guard.yml`: a `changeset:major|minor|patch|none` label makes the
    bot write the changeset, so the version decision can never be forgotten;
  - `issue-lifecycle.yml`: triage, duplicate detection, resolution record, stale
    ageing, one comment per thread updated in place;
  - `.github/labels.yml` as the single source of truth for the labels and the
    paths that trigger them, with `.github/labeler.yml` generated from it;
  - CI fixes found along the way: POSIX-only `EXE001`, wheel-only install of the
    design tooling on a pinned interpreter.